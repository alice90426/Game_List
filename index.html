<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameList</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }

    /* 固定頂部區域（版權 + 選單 + tabs） */
    #header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #fff;
      z-index: 1000;
      border-bottom: 1px solid #ccc;
      padding: 10px 20px;
      display: flex;
      flex-direction: column; /* 上方選單+版權在一行，Tabs 在下一行 */
    }

    /* 第一行: 選單左 + 版權右 */
    #top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    /* 遊戲選單區域 */
    #game-selector {
      display: flex;
      align-items: center;
    }
    #game-selector button { margin: 0 10px; padding: 5px 10px; }
    #game-selector select { padding: 5px; }

    /* 版權訊息 */
    #copyright {
      font-size: 12px;
      color: #555;
      border: 1px solid #ccc;
      padding: 10px;
      background: #f9f9f9;
      text-align: right;
      max-width: 50%; /* 可依需求調整寬度 */
    }

    /* Tab 按鈕 */
    #tabs button { margin-right: 10px; padding: 5px 10px; }
    #tabs button.active { font-weight: bold; }

    /* 內容區 */
    #content-wrapper {
      margin-top: 220px; /* 留出 header 空間 */
      display: flex;
      justify-content: center;
    }

    #content {
      border: 1px solid #ccc;
      padding: 10px;
      min-height: 600px;
      max-width: 900px;
      background: #f9f9f9;
    }

    canvas {
      max-width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

<div id="header">
  <div id="top-row">
    <!-- 左邊: 遊戲選單 -->
    <div id="game-selector">
      <button id="prev">◀</button>
      <select id="game-select"></select>
      <button id="next">▶</button>
    </div>

    <!-- 右邊: 版權 -->
    <div id="copyright">
      <p style="font-weight:bold; margin:0;">Free Version</p>
      <p style="margin:5px 0;">© Javier Chiang. All rights reserved.</p>
      <p style="margin:5px 0; line-height:1.5;">
        This free version is for personal/educational use only.<br>
        Commercial use prohibited without license.
      </p>
    </div>
  </div>

  <!-- 第二行: Tabs -->
  <div id="tabs">
    <button data-tab="md" class="active">GameInformation</button>
    <button data-tab="txt">SimulationResult</button>
  </div>
</div>

<!-- 內容區 -->
<div id="content-wrapper">
  <div id="content">Select Game</div>
</div>

<!-- html2canvas -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const games = ["HT377","HT378"];
let currentIndex = 0;
let currentTab = "md";

const gameSelect = document.getElementById("game-select");
const contentEl = document.getElementById("content");
const tabs = document.querySelectorAll("#tabs button");

// 初始化下拉選單
games.forEach((code, index) => {
  const option = document.createElement("option");
  option.value = index;
  option.textContent = code;
  gameSelect.appendChild(option);
});

// Tab 狀態
function renderTabs() {
  tabs.forEach(t => t.classList.remove("active"));
  document.querySelector(`#tabs button[data-tab="${currentTab}"]`).classList.add("active");
}

// 將文字或 HTML 轉成 Canvas（截圖效果）
async function renderAsImage(htmlContent) {
  const tempDiv = document.createElement("div");
  tempDiv.style.position = "absolute";
  tempDiv.style.left = "-9999px";
  tempDiv.style.width = "800px";
  tempDiv.style.fontFamily = "Arial, sans-serif";
  tempDiv.style.whiteSpace = "pre-wrap";
  tempDiv.innerHTML = htmlContent;
  document.body.appendChild(tempDiv);

  const canvas = await html2canvas(tempDiv, { backgroundColor: "#f9f9f9", scale: 2 });
  document.body.removeChild(tempDiv);
  
  contentEl.innerHTML = "";
  contentEl.appendChild(canvas);
}

// 載入 MD
async function loadMd(gameCode) {
  try {
    const res = await fetch(`${gameCode}/spec/game_infomation.md`);
    const mdText = await res.text();
    const htmlText = marked.parse(mdText);
    await renderAsImage(htmlText);
  } catch(e) {
    contentEl.textContent = "Can't load MD file";
  }
}

// 載入 TXT
async function loadTxt(gameCode) {
  try {
    const res = await fetch(`${gameCode}/simulation/simulation_result.txt`);
    const txt = await res.text();
    // 把換行轉成 <br> 保留排版
    const htmlText = txt.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    await renderAsImage(htmlText);
  } catch(e) {
    contentEl.textContent = "Can't load TXT file";
  }
}

// 載入當前 Tab
function loadCurrentTab() {
  const gameCode = games[currentIndex];
  if(currentTab === "md") loadMd(gameCode);
  else loadTxt(gameCode);
  renderTabs();
}

// 改變遊戲
function setGame(index) {
  currentIndex = (index + games.length) % games.length;
  gameSelect.value = currentIndex;
  loadCurrentTab();
}

// 下拉選單切換
gameSelect.onchange = e => setGame(Number(e.target.value));

// 方向鍵切換
document.addEventListener("keydown", e => {
  if(e.key === "ArrowLeft") setGame(currentIndex-1);
  if(e.key === "ArrowRight") setGame(currentIndex+1);
});

// 左右按鈕切換
document.getElementById("prev").onclick = () => setGame(currentIndex-1);
document.getElementById("next").onclick = () => setGame(currentIndex+1);

// Tab 切換
tabs.forEach(t => {
  t.onclick = () => {
    currentTab = t.dataset.tab;
    loadCurrentTab();
  }
});

// 初始化
setGame(0);
</script>
</body>
</html>
